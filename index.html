<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      touch-action: none;
    }

    a-scene,
    a-scene canvas {
      background: transparent !important;
    }

    .a-enter-vr {
      position: fixed !important;
      right: 8px !important;
      bottom: 8px !important;
      z-index: 9999 !important;
      transform: scale(0.6);
      transform-origin: bottom right;
    }

    .a-enter-ar {
      display: none !important;
    }
  </style>

  <script>
    AFRAME.registerComponent('transparent-bg', {
      init: function () {
        this.apply = () => {
          const renderer = this.el.renderer;
          if (!renderer) return;

          renderer.setClearColor(0x000000, 0);
          renderer.setClearAlpha(0);
          this.el.object3D.background = null;
        };

        this.el.addEventListener('renderstart', this.apply);
      },

      tick: function () {
        this.apply();
      }
    });

    AFRAME.registerComponent('center-gltf-in-pivot', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          const pivotElement = this.el.parentEl;

          if (!mesh || !pivotElement) return;

          const pivot = pivotElement.object3D;

          pivot.updateMatrixWorld(true);
          this.el.object3D.updateMatrixWorld(true);

          const bounds = new THREE.Box3().setFromObject(mesh);
          const centerWorld = bounds.getCenter(new THREE.Vector3());
          const centerInPivot = pivot.worldToLocal(centerWorld.clone());

          this.el.object3D.position.sub(centerInPivot);
        });
      }
    });

    AFRAME.registerComponent('drag-rotate-active-marker', {
      init: function () {
        const scene = this.el;

        this.activeModel = null;
        this.baseScale = 1;
        this.mode = null;
        this.lastX = 0;
        this.lastY = 0;
        this.lastDist = 0;

        const MIN_ZOOM = 0.3;
        const MAX_ZOOM = 5;

        const touchDist = (touches) =>
          Math.hypot(
            touches[0].clientX - touches[1].clientX,
            touches[0].clientY - touches[1].clientY
          );

        this.applyZoom = (factor) => {
          if (!this.activeModel) return;

          let next = this.activeModel.scale.x * factor;
          next = Math.min(
            this.baseScale * MAX_ZOOM,
            Math.max(this.baseScale * MIN_ZOOM, next)
          );

          this.activeModel.scale.setScalar(next);
        };

        this.onTouchStart = (event) => {
          if (event.target.closest && event.target.closest('.a-enter-vr')) return;
          if (!this.activeModel) return;

          event.preventDefault();

          if (event.touches.length >= 2) {
            this.mode = 'pinch';
            this.lastDist = touchDist(event.touches);
          } else {
            this.mode = 'rotate';
            this.lastX = event.touches[0].clientX;
            this.lastY = event.touches[0].clientY;
          }
        };

        this.onTouchMove = (event) => {
          if (!this.activeModel || !this.mode) return;

          event.preventDefault();

          if (event.touches.length >= 2) {
            const distance = touchDist(event.touches);

            if (this.mode !== 'pinch' || this.lastDist === 0) {
              this.mode = 'pinch';
              this.lastDist = distance;
              return;
            }

            this.applyZoom(distance / this.lastDist);
            this.lastDist = distance;
            return;
          }

          const touch = event.touches[0];

          if (this.mode === 'pinch') {
            this.mode = 'rotate';
            this.lastX = touch.clientX;
            this.lastY = touch.clientY;
            return;
          }

          const deltaX = touch.clientX - this.lastX;
          const deltaY = touch.clientY - this.lastY;

          this.activeModel.rotateY(deltaX * 0.01);
          this.activeModel.rotateX(deltaY * 0.01);

          this.lastX = touch.clientX;
          this.lastY = touch.clientY;
        };

        this.onTouchEnd = (event) => {
          if (event.touches.length === 0) {
            this.mode = null;
            this.lastDist = 0;
          } else if (event.touches.length === 1) {
            this.mode = 'rotate';
            this.lastX = event.touches[0].clientX;
            this.lastY = event.touches[0].clientY;
            this.lastDist = 0;
          }
        };

        this.onWheel = (event) => {
          if (!this.activeModel) return;

          event.preventDefault();
          this.applyZoom(event.deltaY < 0 ? 1.1 : 0.9);
        };

        this.attachControls = () => {
          scene.querySelectorAll('a-marker').forEach((marker) => {
            const model = marker.querySelector('[gltf-model]');
            if (!model) return;

            const rotationTarget =
              model.parentEl && model.parentEl.hasAttribute('data-pivot')
                ? model.parentEl.object3D
                : model.object3D;

            const originalScale = rotationTarget.scale.x;

            marker.addEventListener('markerFound', () => {
              this.activeModel = rotationTarget;
              this.baseScale = originalScale;
            });

            marker.addEventListener('markerLost', () => {
              if (this.activeModel === rotationTarget) {
                this.activeModel = null;
                this.mode = null;
                this.lastDist = 0;
              }
            });
          });

          const options = { passive: false };

          document.addEventListener('touchstart', this.onTouchStart, options);
          document.addEventListener('touchmove', this.onTouchMove, options);
          document.addEventListener('touchend', this.onTouchEnd, options);
          document.addEventListener('touchcancel', this.onTouchEnd, options);
          window.addEventListener('wheel', this.onWheel, options);
        };

        if (scene.hasLoaded) {
          this.attachControls();
        } else {
          scene.addEventListener('loaded', this.attachControls, { once: true });
        }
      }
    });

    AFRAME.registerComponent('screen-fixed', {
      schema: {
        distance: { default: 3 },
        size: { default: 0.5 }
      },

      init: function () {
        const marker = this.el;
        const scene = marker.sceneEl;
        const child = marker.querySelector(':scope > a-entity');

        if (!child) return;

        const obj = child.object3D;
        const holder = new THREE.Group();

        let attached = false;
        let fitted = false;
        let found = false;
        let lostTimer = null;

        const attach = () => {
          const camera = scene.querySelector('[camera]');
          if (!camera) return false;

          holder.position.set(0, 0, -this.data.distance);
          camera.object3D.add(holder);
          holder.add(obj);
          attached = true;

          return true;
        };

        const syncZoomBase = () => {
          setTimeout(() => {
            const drag = scene.components['drag-rotate-active-marker'];

            if (drag && drag.activeModel === obj) {
              drag.baseScale = obj.scale.x;
            }
          }, 0);
        };

        const fit = () => {
          if (fitted) return;

          const gltfElement = child.hasAttribute('gltf-model')
            ? child
            : child.querySelector('[gltf-model]');

          const content = gltfElement && gltfElement.getObject3D('mesh');
          if (!content) return;

          obj.updateWorldMatrix(true, true);

          const box = new THREE.Box3().setFromObject(content);
          box.applyMatrix4(
            new THREE.Matrix4().copy(obj.matrixWorld).invert()
          );

          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDimension = Math.max(size.x, size.y, size.z);

          if (!isFinite(maxDimension) || maxDimension === 0) return;

          content.position.sub(center);

          const projection = scene.camera.projectionMatrix.elements;
          const rect = scene.canvas.getBoundingClientRect();

          const fractionWidth = Math.min(1, window.innerWidth / rect.width);
          const fractionHeight = Math.min(1, window.innerHeight / rect.height);

          const visibleWidth =
            (2 * this.data.distance / projection[0]) * fractionWidth;
          const visibleHeight =
            (2 * this.data.distance / projection[5]) * fractionHeight;

          const targetSize =
            Math.min(visibleWidth, visibleHeight) * this.data.size;

          obj.scale.setScalar(targetSize / maxDimension);
          fitted = true;
        };

        const show = () => {
          obj.visible = found && fitted;

          if (obj.visible) {
            syncZoomBase();
          }
        };

        obj.visible = false;

        marker.addEventListener('markerFound', () => {
          if (lostTimer) {
            clearTimeout(lostTimer);
            lostTimer = null;
          }

          found = true;

          if (!attached && !attach()) return;

          fit();
          show();
        });

        marker.addEventListener('markerLost', () => {
          // Evita piscar quando o rastreamento perde o alvo por um instante.
          if (lostTimer) clearTimeout(lostTimer);

          lostTimer = setTimeout(() => {
            found = false;
            obj.visible = false;
            lostTimer = null;
          }, 450);
        });

        marker.addEventListener('model-loaded', () => {
          if (attached) {
            fit();
            show();
          }
        });
      }
    });

    function fitCamera() {
      const video = document.getElementById('arjs-video');
      const canvas = document.querySelector('a-scene canvas');

      if (!video || !canvas || !video.videoWidth || !video.videoHeight) return;

      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const scale = Math.max(
        screenWidth / video.videoWidth,
        screenHeight / video.videoHeight
      );

      const width = video.videoWidth * scale;
      const height = video.videoHeight * scale;

      const setImportant = (element, property, value) => {
        if (
          element.style.getPropertyValue(property) !== value ||
          element.style.getPropertyPriority(property) !== 'important'
        ) {
          element.style.setProperty(property, value, 'important');
        }
      };

      [video, canvas].forEach((element) => {
        setImportant(element, 'position', 'fixed');
        setImportant(element, 'top', '50%');
        setImportant(element, 'left', '50%');
        setImportant(element, 'margin', '0');
        setImportant(element, 'width', width + 'px');
        setImportant(element, 'height', height + 'px');
        setImportant(element, 'transform', 'translate(-50%, -50%)');
      });

      setImportant(video, 'z-index', '0');
      setImportant(video, 'display', 'block');
      setImportant(video, 'visibility', 'visible');
      setImportant(canvas, 'z-index', '1');
    }

    let fitFrame = null;

    function scheduleFitCamera() {
      if (fitFrame !== null) {
        cancelAnimationFrame(fitFrame);
      }

      fitFrame = requestAnimationFrame(() => {
        fitFrame = null;
        fitCamera();
      });
    }

    function watchCameraVideo() {
      const video = document.getElementById('arjs-video');
      if (!video) return false;

      video.addEventListener('loadedmetadata', scheduleFitCamera, { once: true });
      video.addEventListener('playing', scheduleFitCamera, { once: true });

      if (video.videoWidth && video.videoHeight) {
        scheduleFitCamera();
      }

      return true;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');

      if (scene) {
        scene.addEventListener('camera-init', scheduleFitCamera);
        scene.addEventListener('renderstart', scheduleFitCamera);
      }

      window.addEventListener('camera-init', scheduleFitCamera);
      window.addEventListener('resize', scheduleFitCamera, { passive: true });

      window.addEventListener(
        'orientationchange',
        () => setTimeout(scheduleFitCamera, 300),
        { passive: true }
      );

      if (!watchCameraVideo()) {
        const observer = new MutationObserver(() => {
          if (watchCameraVideo()) {
            observer.disconnect();
          }
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true
        });

        setTimeout(() => observer.disconnect(), 15000);
      }
    });
  </script>
</head>

<body>
  <a-scene
    embedded
    transparent-bg
    drag-rotate-active-marker
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: true"
    renderer="alpha: true; antialias: false;">

    <!-- Modelagem KKKK -->
    <a-marker
      type="pattern"
      url="./pattern-kkkk.patt"
      emitevents="true"
      screen-fixed>

      <a-entity
        data-pivot
        position="0 0 0"
        scale="0.10 0.10 0.10">

        <a-entity
          position="0 0 0"
          gltf-model="./kkkk/scene.gltf"
          center-gltf-in-pivot>
        </a-entity>

      </a-entity>
    </a-marker>

    <!-- Modelagem Mascote -->
    <a-marker
      type="pattern"
      url="./pattern-mascote.patt"
      emitevents="true"
      screen-fixed>

      <a-entity
        position="0 0 0"
        scale="4 4 4"
        gltf-model="./mascote/2441948.gltf">
      </a-entity>
    </a-marker>

    <!-- Modelagem Guaracuí -->
    <a-marker
      type="pattern"
      url="./pattern-Guaracui.patt"
      emitevents="true"
      screen-fixed>

      <a-entity
        position="0 0 0"
        scale="0.20 0.20 0.20"
        gltf-model="./guaracui/2441949.gltf">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
