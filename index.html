<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script>
  AFRAME.registerComponent('drag-rotate-active-marker', {
    init: function () {
      const scene = this.el;
      this.activeModel = null;
      this.dragging = false;

      this.onDown = (event) => {
        if (!this.activeModel) return;

        this.dragging = true;
        this.lastX = event.clientX;
        this.lastY = event.clientY;
        event.preventDefault();
      };

      this.onMove = (event) => {
        if (!this.dragging || !this.activeModel) return;

        const deltaX = event.clientX - this.lastX;
        const deltaY = event.clientY - this.lastY;

        // Arrastar para os lados gira no eixo Y;
        // arrastar para cima ou para baixo gira no eixo X.
        this.activeModel.rotateY(deltaX * 0.01);
        this.activeModel.rotateX(deltaY * 0.01);

        this.lastX = event.clientX;
        this.lastY = event.clientY;
      };

      this.onUp = () => {
        this.dragging = false;
      };

      this.attachControls = () => {
        scene.querySelectorAll('a-marker').forEach((marker) => {
          const model = marker.querySelector('[gltf-model]');
          if (!model) return;

          marker.addEventListener('markerFound', () => {
            this.activeModel = model.object3D;
          });

          marker.addEventListener('markerLost', () => {
            if (this.activeModel === model.object3D) {
              this.activeModel = null;
              this.dragging = false;
            }
          });
        });

        const canvas = scene.canvas;
        if (!canvas) return;

        canvas.style.touchAction = 'none';
        canvas.addEventListener('pointerdown', this.onDown);
        window.addEventListener('pointermove', this.onMove);
        window.addEventListener('pointerup', this.onUp);
        window.addEventListener('pointercancel', this.onUp);
      };

      if (scene.hasLoaded) {
        this.attachControls();
      } else {
        scene.addEventListener('loaded', this.attachControls, { once: true });
      }
    }
  });
</script>
</head>

<body style="margin: 0; overflow: hidden;">
  <a-scene
    embedded
    drag-rotate-active-marker
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;">

    <!-- Modelagem KKKK -->
    <a-marker type="pattern" url="./pattern-kkkk.patt" emitevents="true">
      <a-entity position="0 0 0" scale="0.20 0.20 0.20">
        <a-entity
          position="0 0 0"
          gltf-model="./kkkk/scene.gltf"
          >
        </a-entity>
      </a-entity>
    </a-marker>

    <!-- Modelagem Mascote -->
    <a-marker type="pattern" url="./pattern-mascote.patt" emitevents="true">
      <a-entity
        position="0 0 0"
        scale="4 4 4"
        gltf-model="./mascote/2441948.gltf"
        >
      </a-entity>
    </a-marker>

    <!-- Modelagem Guaracuí -->
    <a-marker type="pattern" url="./pattern-Guaracui.patt" emitevents="true">
      <a-entity
        position="0 0 0"
        scale="0.20 0.20 0.20"
        gltf-model="./guaracui/2441949.gltf"
        >
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
