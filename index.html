<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">


  <meta name="viewport" content="width=980, user-scalable=no">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      touch-action: none;
    }
    a-scene {
      background: transparent !important;
    }
    a-scene canvas {
      background: transparent !important;
    }

    .a-enter-vr {
      position: fixed !important;
      right: 8px !important;
      bottom: 8px !important;
      z-index: 9999 !important;
      transform: scale(0.6);
      transform-origin: bottom right;
    }
    .a-enter-ar {
      display: none !important;
    }
  </style>

  <script>

    AFRAME.registerComponent('transparent-bg', {
      init: function () {
        this.apply = () => {
          const r = this.el.renderer;
          if (!r) return;
          r.setClearColor(0x000000, 0);
          r.setClearAlpha(0);
          this.el.object3D.background = null;
        };
        this.el.addEventListener('renderstart', this.apply);
      },
      tick: function () {
        this.apply();
      }
    });

    AFRAME.registerComponent('center-gltf-in-pivot', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          const pivotElement = this.el.parentEl;

          if (!mesh || !pivotElement) return;

          const pivot = pivotElement.object3D;

          pivot.updateMatrixWorld(true);
          this.el.object3D.updateMatrixWorld(true);

          const bounds = new THREE.Box3().setFromObject(mesh);
          const centerWorld = bounds.getCenter(new THREE.Vector3());
          const centerInPivot = pivot.worldToLocal(centerWorld.clone());

          this.el.object3D.position.sub(centerInPivot);
        });
      }
    });

    AFRAME.registerComponent('drag-rotate-active-marker', {
      init: function () {
        const scene = this.el;

        this.activeModel = null;
        this.baseScale = 1;
        this.mode = null; 
        this.lastX = 0;
        this.lastY = 0;
        this.lastDist = 0;

        const MIN_ZOOM = 0.3; 
        const MAX_ZOOM = 5;   

        const touchDist = (t) =>
          Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

        this.applyZoom = (factor) => {
          if (!this.activeModel) return;
          let next = this.activeModel.scale.x * factor;
          next = Math.min(this.baseScale * MAX_ZOOM, Math.max(this.baseScale * MIN_ZOOM, next));
          this.activeModel.scale.setScalar(next);
        };

        this.onTouchStart = (e) => {

          if (e.target.closest && e.target.closest('.a-enter-vr')) return;
          if (!this.activeModel) return;
          e.preventDefault();

          if (e.touches.length >= 2) {
            this.mode = 'pinch';
            this.lastDist = touchDist(e.touches);
          } else {
            this.mode = 'rotate';
            this.lastX = e.touches[0].clientX;
            this.lastY = e.touches[0].clientY;
          }
        };

        this.onTouchMove = (e) => {
          if (!this.activeModel || !this.mode) return;
          e.preventDefault();

          if (e.touches.length >= 2) {
            const d = touchDist(e.touches);
            if (this.mode !== 'pinch' || this.lastDist === 0) {
              this.mode = 'pinch';
              this.lastDist = d;
              return;
            }
            this.applyZoom(d / this.lastDist);
            this.lastDist = d;
            return;
          }

          const t = e.touches[0];
          if (this.mode === 'pinch') {
            this.mode = 'rotate';
            this.lastX = t.clientX;
            this.lastY = t.clientY;
            return;
          }

          const deltaX = t.clientX - this.lastX;
          const deltaY = t.clientY - this.lastY;

          this.activeModel.rotateY(deltaX * 0.01);
          this.activeModel.rotateX(deltaY * 0.01);

          this.lastX = t.clientX;
          this.lastY = t.clientY;
        };

        this.onTouchEnd = (e) => {
          if (e.touches.length === 0) {
            this.mode = null;
            this.lastDist = 0;
          } else if (e.touches.length === 1) {
            this.mode = 'rotate';
            this.lastX = e.touches[0].clientX;
            this.lastY = e.touches[0].clientY;
            this.lastDist = 0;
          }
        };

        this.onWheel = (e) => {
          if (!this.activeModel) return;
          e.preventDefault();
          this.applyZoom(e.deltaY < 0 ? 1.1 : 0.9);
        };

        this.attachControls = () => {
          scene.querySelectorAll('a-marker').forEach((marker) => {
            const model = marker.querySelector('[gltf-model]');
            if (!model) return;

            const rotationTarget =
              model.parentEl && model.parentEl.hasAttribute('data-pivot')
                ? model.parentEl.object3D
                : model.object3D;

            const originalScale = rotationTarget.scale.x;

            marker.addEventListener('markerFound', () => {
              this.activeModel = rotationTarget;
              this.baseScale = originalScale;
            });

            marker.addEventListener('markerLost', () => {
              if (this.activeModel === rotationTarget) {
                this.activeModel = null;
                this.mode = null;
                this.lastDist = 0;
              }
            });
          });

          const opts = { passive: false };
          document.addEventListener('touchstart', this.onTouchStart, opts);
          document.addEventListener('touchmove', this.onTouchMove, opts);
          document.addEventListener('touchend', this.onTouchEnd, opts);
          document.addEventListener('touchcancel', this.onTouchEnd, opts);
          window.addEventListener('wheel', this.onWheel, opts);
        };

        if (scene.hasLoaded) {
          this.attachControls();
        } else {
          scene.addEventListener('loaded', this.attachControls, { once: true });
        }
      }
    });

AFRAME.registerComponent('screen-fixed', {
  schema: {
    distance: { default: 3 },   
    size: { default: 0.5 }     
  },

  init: function () {
    const marker = this.el;
    const scene = marker.sceneEl;
    const child = marker.querySelector(':scope > a-entity');
    if (!child) return;

    const obj = child.object3D;
    const holder = new THREE.Group();
    let attached = false;
    let fitted = false;
    let found = false;

    const attach = () => {
      const camEl = scene.querySelector('[camera]');
      if (!camEl) return false;
      holder.position.set(0, 0, -this.data.distance);
      camEl.object3D.add(holder);
      holder.add(obj);
      attached = true;
      return true;
    };
  
    const syncZoomBase = () => {
      setTimeout(() => {
        const d = scene.components['drag-rotate-active-marker'];
        if (d && d.activeModel === obj) d.baseScale = obj.scale.x;
      }, 0);
    };

    const fit = () => {
      if (fitted) return;
      const gltfEl = child.hasAttribute('gltf-model') ? child : child.querySelector('[gltf-model]');
      const content = gltfEl && gltfEl.getObject3D('mesh');
      if (!content) return;

      obj.updateWorldMatrix(true, true);
      const box = new THREE.Box3().setFromObject(content);
      box.applyMatrix4(new THREE.Matrix4().copy(obj.matrixWorld).invert());

      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      if (!isFinite(maxDim) || maxDim === 0) return;

      content.position.sub(center);

      const e = scene.camera.projectionMatrix.elements;
      const rect = scene.canvas.getBoundingClientRect();
      const fracW = Math.min(1, window.innerWidth / rect.width);
      const fracH = Math.min(1, window.innerHeight / rect.height);
      const visW = (2 * this.data.distance / e[0]) * fracW;
      const visH = (2 * this.data.distance / e[5]) * fracH;
      const target = Math.min(visW, visH) * this.data.size;

      obj.scale.setScalar(target / maxDim);
      fitted = true;
    };

    const show = () => {
      obj.visible = found && fitted;
      if (obj.visible) syncZoomBase();
    };

    obj.visible = false;

    marker.addEventListener('markerFound', () => {
      found = true;
      if (!attached && !attach()) return;
      fit();
      show();
    });

    marker.addEventListener('markerLost', () => {
      found = false;
      obj.visible = false;
    });

    marker.addEventListener('model-loaded', () => {
      if (attached) { fit(); show(); }
    });
  }
});


    function fitCamera() {
      const video = document.getElementById('arjs-video');
      const canvas = document.querySelector('a-scene canvas');
      if (!video || !canvas || !video.videoWidth || !video.videoHeight) return;

      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const scale = Math.max(sw / video.videoWidth, sh / video.videoHeight);
      const w = video.videoWidth * scale;
      const h = video.videoHeight * scale;

      [video, canvas].forEach((el) => {
        el.style.setProperty('position', 'fixed', 'important');
        el.style.setProperty('top', '50%', 'important');
        el.style.setProperty('left', '50%', 'important');
        el.style.setProperty('margin', '0', 'important');
        el.style.setProperty('width', w + 'px', 'important');
        el.style.setProperty('height', h + 'px', 'important');
        el.style.setProperty('transform', 'translate(-50%, -50%)', 'important');
      });


      video.style.setProperty('z-index', '0', 'important');
      video.style.setProperty('display', 'block', 'important');
      video.style.setProperty('visibility', 'visible', 'important');
      canvas.style.setProperty('z-index', '1', 'important');
    }

    setInterval(fitCamera, 300);
    window.addEventListener('resize', () => setTimeout(fitCamera, 100));
    window.addEventListener('orientationchange', () => setTimeout(fitCamera, 500));
    window.addEventListener('camera-init', () => {
      [300, 800, 1500, 3000].forEach((ms) => setTimeout(fitCamera, ms));
    });
  </script>
</head>

<body>
  <a-scene
    embedded
    transparent-bg
    drag-rotate-active-marker
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: true"
    renderer="alpha: true; antialias: true;">


    <a-marker
      type="pattern"
      url="./pattern-kkkk.patt"
      emitevents="true"
      screen-fixed>

      <a-entity
        data-pivot
        position="0 0 0"
        scale="0.10 0.10 0.10">

        <a-entity
          position="0 0 0"
          gltf-model="./kkkk/scene.gltf"
          center-gltf-in-pivot>
        </a-entity>

      </a-entity>
    </a-marker>


    <a-marker
      type="pattern"
      url="./pattern-mascote.patt"
      emitevents="true"
      screen-fixed>

      <a-entity
        position="0 0 0"
        scale="4 4 4"
        gltf-model="./mascote/2441948.gltf">
      </a-entity>
    </a-marker>


    <a-marker
      type="pattern"
      url="./pattern-Guaracui.patt"
      emitevents="true"
      screen-fixed>

      <a-entity
        position="0 0 0"
        scale="0.20 0.20 0.20"
        gltf-model="./guaracui/2441949.gltf">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
