<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=980, user-scalable=no">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      touch-action: none;
    }
    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }
    a-scene canvas {
      background: transparent !important;
    }
    .a-enter-vr {
      right: 8px !important;
      bottom: 8px !important;
      transform: scale(0.6);
      transform-origin: bottom right;
    }
    .a-enter-ar {
      display: none !important;
    }
  </style>

  <script>
    AFRAME.registerComponent('center-gltf-in-pivot', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          const pivotElement = this.el.parentEl;

          if (!mesh || !pivotElement) return;

          const pivot = pivotElement.object3D;

          pivot.updateMatrixWorld(true);
          this.el.object3D.updateMatrixWorld(true);

          const bounds = new THREE.Box3().setFromObject(mesh);
          const centerWorld = bounds.getCenter(new THREE.Vector3());
          const centerInPivot = pivot.worldToLocal(centerWorld.clone());

          this.el.object3D.position.sub(centerInPivot);
        });
      }
    });

    AFRAME.registerComponent('drag-rotate-active-marker', {
      init: function () {
        const scene = this.el;

        this.activeModel = null;
        this.baseScale = 1;
        this.mode = null;
        this.lastX = 0;
        this.lastY = 0;
        this.lastDist = 0;

        const touchDist = (t) =>
          Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

        this.applyZoom = (factor) => {
          const next = this.activeModel.scale.x * factor;
          const min = this.baseScale * 0.3;
          const max = this.baseScale * 5;
          this.activeModel.scale.setScalar(Math.min(max, Math.max(min, next)));
        };

        this.onTouchStart = (e) => {
          if (e.target.closest && e.target.closest('.a-enter-vr')) return;
          if (!this.activeModel) return;
          e.preventDefault();

          if (e.touches.length >= 2) {
            this.mode = 'pinch';
            this.lastDist = touchDist(e.touches);
          } else {
            this.mode = 'rotate';
            this.lastX = e.touches[0].clientX;
            this.lastY = e.touches[0].clientY;
          }
        };

        this.onTouchMove = (e) => {
          if (!this.activeModel || !this.mode) return;
          e.preventDefault();

          if (e.touches.length >= 2) {
            const d = touchDist(e.touches);
            if (this.mode === 'pinch' && this.lastDist > 0) {
              this.applyZoom(d / this.lastDist);
            }
            this.mode = 'pinch';
            this.lastDist = d;
            return;
          }

          const t = e.touches[0];
          if (this.mode === 'pinch') {
            this.mode = 'rotate';
            this.lastX = t.clientX;
            this.lastY = t.clientY;
            return;
          }

          this.activeModel.rotateY((t.clientX - this.lastX) * 0.01);
          this.activeModel.rotateX((t.clientY - this.lastY) * 0.01);

          this.lastX = t.clientX;
          this.lastY = t.clientY;
        };

        this.onTouchEnd = (e) => {
          this.lastDist = 0;
          if (e.touches.length === 0) {
            this.mode = null;
          } else if (e.touches.length === 1) {
            this.mode = 'rotate';
            this.lastX = e.touches[0].clientX;
            this.lastY = e.touches[0].clientY;
          }
        };

        this.attachControls = () => {
          scene.querySelectorAll('a-marker').forEach((marker) => {
            const model = marker.querySelector('[gltf-model]');
            if (!model) return;

            const rotationTarget =
              model.parentEl && model.parentEl.hasAttribute('data-pivot')
                ? model.parentEl.object3D
                : model.object3D;

            const originalScale = rotationTarget.scale.x;

            marker.addEventListener('markerFound', () => {
              this.activeModel = rotationTarget;
              this.baseScale = originalScale;
            });

            marker.addEventListener('markerLost', () => {
              if (this.activeModel === rotationTarget) {
                this.activeModel = null;
                this.mode = null;
                this.lastDist = 0;
              }
            });
          });

          const opts = { passive: false };
          document.addEventListener('touchstart', this.onTouchStart, opts);
          document.addEventListener('touchmove', this.onTouchMove, opts);
          document.addEventListener('touchend', this.onTouchEnd, opts);
          document.addEventListener('touchcancel', this.onTouchEnd, opts);
        };

        if (scene.hasLoaded) {
          this.attachControls();
        } else {
          scene.addEventListener('loaded', this.attachControls, { once: true });
        }
      }
    });

    function fitCamera() {
      const video = document.getElementById('arjs-video');
      const canvas = document.querySelector('a-scene canvas');
      if (!video || !canvas || !video.videoWidth) return;

      const scale = Math.max(
        window.innerWidth / video.videoWidth,
        window.innerHeight / video.videoHeight
      );
      const w = video.videoWidth * scale + 'px';
      const h = video.videoHeight * scale + 'px';

      [video, canvas].forEach((el) => {
        el.style.setProperty('position', 'fixed', 'important');
        el.style.setProperty('top', '50%', 'important');
        el.style.setProperty('left', '50%', 'important');
        el.style.setProperty('margin', '0', 'important');
        el.style.setProperty('width', w, 'important');
        el.style.setProperty('height', h, 'important');
        el.style.setProperty('transform', 'translate(-50%, -50%)', 'important');
      });

      video.style.setProperty('z-index', '0', 'important');
      canvas.style.setProperty('z-index', '1', 'important');
    }

    const scheduleFit = () => [100, 500, 1500, 3000].forEach((ms) => setTimeout(fitCamera, ms));
    window.addEventListener('camera-init', scheduleFit);
    window.addEventListener('resize', scheduleFit);
    window.addEventListener('orientationchange', scheduleFit);
  </script>
</head>

<body>
  <a-scene
    embedded
    drag-rotate-active-marker
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: true"
    renderer="logarithmicDepthBuffer: true; alpha: true;">

    <a-marker
      type="pattern"
      url="./pattern-kkkk.patt"
      emitevents="true">

      <a-entity
        data-pivot
        position="0 0 0"
        scale="0.10 0.10 0.10">

        <a-entity
          position="0 0 0"
          gltf-model="./kkkk/scene.gltf"
          center-gltf-in-pivot>
        </a-entity>

      </a-entity>
    </a-marker>

    <a-marker
      type="pattern"
      url="./pattern-mascote.patt"
      emitevents="true">

      <a-entity
        position="0 0 0"
        scale="4 4 4"
        gltf-model="./mascote/2441948.gltf">
      </a-entity>
    </a-marker>

    <a-marker
      type="pattern"
      url="./pattern-Guaracui.patt"
      emitevents="true">

      <a-entity
        position="0 0 0"
        scale="0.20 0.20 0.20"
        gltf-model="./guaracui/2441949.gltf">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
